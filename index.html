<html lang="fr">
<head>

<title>MinisPop</title>
<meta name="description" content="MinisPop, le jeu de Noël où l'on fait pop les Minis. Un jeu simple et mignon pour les enfants.">
<style>
  :root { --bg: #1b2a4a; --bg2: #2d4373; --fg: #ffffff; --muted: #c9d6ee; --accent: #ffd54f; }
  body { margin: 0; min-height: 100vh; color: var(--fg);
         background: linear-gradient(180deg, var(--bg2), var(--bg));
         font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; align-items: center; justify-content: center; text-align: center; }
  main { max-width: 640px; padding: 32px 16px; }
  h1 { font-size: clamp(2.6rem, 10vw, 4.2rem); margin: 0; font-weight: 900; letter-spacing: -1px; }
  .minis { font-size: 2.6rem; margin: 8px 0 16px; }
  p { color: var(--muted); }
  a { color: var(--accent); }
  footer { margin-top: 40px; font-size: .9rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>MinisPop</h1>
  <div class="minis" aria-hidden="true">🧝 ⛄ ⭐ 🐧</div>
  <p>Les Minis sortent de leurs tas de neige : tape-les vite avant qu'ils se cachent !<br>
     Un petit jeu de Noël, simple et mignon, pensé pour les enfants.</p>
  <p><em>Bientôt sur Google Play.</em></p>
